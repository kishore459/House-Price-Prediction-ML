<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ProphetAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-city"></i>
            </div>
            <span>Prophet<span class="highlight">AI</span></span>
        </a>

        <div class="nav-actions">
            <a href="/" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="/login" class="btn btn-outline btn-sm">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
            </a>
        </div>
    </nav>

    <!-- Registration Container -->
    <div class="main-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-badge">
                    <i class="fa-solid fa-user-plus"></i> Join Us
                </div>
                <h2>Create Account</h2>
                <p>Register to unlock personalized property valuation & price insights</p>
            </div>

            <div id="authAlert" class="alert alert-danger" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="alertMessage">Error message here</span>
            </div>

            <form id="registerForm" action="/dashboard" method="GET">
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="regFullName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="regFullName" name="fullname" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- Username & Preferred City -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="regUsername">Username</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at input-icon"></i>
                            <input type="text" id="regUsername" name="username" class="form-control" placeholder="johndoe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regCity">Target City</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot input-icon"></i>
                            <select id="regCity" name="city" class="form-control" required>
                                <option value="chennai">Chennai</option>
                                <option value="bengaluru">Bengaluru</option>
                                <option value="both" selected>Both Cities</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="regPassword" name="password" class="form-control" placeholder="••••••••" minlength="6" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)" aria-label="Toggle password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-check input-icon"></i>
                        <input type="password" id="regConfirmPassword" name="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regConfirmPassword', this)" aria-label="Toggle confirm password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms & Conditions -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="regTerms" required>
                        <span>I agree to the <a href="#" style="color: #818cf8;">Terms of Service</a> & <a href="#" style="color: #818cf8;">Privacy Policy</a></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-user-check"></i> Register Now
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign In here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-copy">© 2026 ProphetAI Real Estate Valuation. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
