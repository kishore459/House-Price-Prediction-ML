<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chennai House Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand">House<span>Predict</span></a>
        
        <button class="mobile-btn" id="menuToggle" aria-label="Toggle Menu">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="/">Home</a></li>
            <li><a href="/chennai" class="active">Chennai Predictor</a></li>
            <li><a href="/bengaluru">Bengaluru Predictor</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="form-container">
            <div class="form-header">
                <h2>Chennai House Prediction</h2>
                <p>Fill in the property details to estimate the price</p>
            </div>

            <form id="predictionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="chennaiArea">Area (sqft)</label>
                        <input type="number" id="chennaiArea" name="area" placeholder="e.g. 1200" required>
                    </div>

                    <div class="form-group">
                        <label for="chennaiBhk">BHK</label>
                        <input type="number" id="chennaiBhk" name="bhk" placeholder="e.g. 2" min="1" max="10" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="chennaiBathroom">Bathrooms</label>
                        <input type="number" id="chennaiBathroom" name="bathroom" placeholder="e.g. 2" min="1" max="10" required>
                    </div>

                    <div class="form-group">
                        <label for="chennaiAge">Property Age (Years)</label>
                        <input type="number" id="chennaiAge" name="age" placeholder="e.g. 3" min="0" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="chennaiStatus">Status</label>
                    <select id="chennaiStatus" name="status">
                        <option value="Ready to Move">Ready to Move</option>
                        <option value="Under Construction">Under Construction</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="chennaiLocation">Location</label>
                    <select id="chennaiLocation" name="location">
                        <option value="Adyar">Adyar</option>
                        <option value="Velachery">Velachery</option>
                        <option value="Anna Nagar">Anna Nagar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="chennaiBuilder">Builder</label>
                    <select id="chennaiBuilder" name="builder">
                        <option value="DLF">DLF</option>
                        <option value="Casagrand">Casagrand</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" id="predictBtn">Predict Price</button>
            </form>

            <div id="result"></div>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <a href="/" class="btn btn-outline" style="margin-top: 0;">&larr; Back to Home</a>
                <a href="/bengaluru" class="btn btn-outline" style="margin-top: 0;">Bengaluru Predictor &rarr;</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 House Price Prediction System - Chennai & Bengaluru</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
