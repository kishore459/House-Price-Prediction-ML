<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru House Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand">House<span>Predict</span></a>
        
        <button class="mobile-btn" id="menuToggle" aria-label="Toggle Menu">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="/">Home</a></li>
            <li><a href="/chennai">Chennai Predictor</a></li>
            <li><a href="/bengaluru" class="active">Bengaluru Predictor</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="form-container">
            <div class="form-header">
                <h2>Bengaluru House Prediction</h2>
                <p>Fill in the property details to estimate the price</p>
            </div>

            <form id="predictionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="bengaluruSqft">Total Sqft</label>
                        <input type="number" id="bengaluruSqft" name="sqft" placeholder="e.g. 1400" required>
                    </div>

                    <div class="form-group">
                        <label for="bengaluruBhk">BHK</label>
                        <input type="number" id="bengaluruBhk" name="bhk" placeholder="e.g. 2" min="1" max="10" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bengaluruBath">Bathrooms</label>
                        <input type="number" id="bengaluruBath" name="bath" placeholder="e.g. 2" min="1" max="10" required>
                    </div>

                    <div class="form-group">
                        <label for="bengaluruAge">Property Age (Years)</label>
                        <input type="number" id="bengaluruAge" name="age" placeholder="e.g. 2" min="0" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bengaluruLocation">Location</label>
                    <select id="bengaluruLocation" name="location">
                        <option value="Whitefield">Whitefield</option>
                        <option value="Indiranagar">Indiranagar</option>
                        <option value="Electronic City">Electronic City</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-bengaluru" id="predictBtn">Predict Price</button>
            </form>

            <div id="result"></div>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <a href="/" class="btn btn-outline" style="margin-top: 0;">&larr; Back to Home</a>
                <a href="/chennai" class="btn btn-outline" style="margin-top: 0;">Chennai Predictor &rarr;</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 House Price Prediction System - Chennai & Bengaluru</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
