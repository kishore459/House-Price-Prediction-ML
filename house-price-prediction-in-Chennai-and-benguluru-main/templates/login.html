<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ProphetAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-city"></i>
            </div>
            <span>Prophet<span class="highlight">AI</span></span>
        </a>

        <div class="nav-actions">
            <a href="/" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="/register" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-user-plus"></i> Register
            </a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="main-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-badge">
                    <i class="fa-solid fa-lock"></i> Welcome Back
                </div>
                <h2>Member Login</h2>
                <p>Sign in to access your saved valuation models & prediction tools</p>
            </div>

            <form id="loginForm" action="/dashboard" method="GET">
                <!-- Username or Email -->
                <div class="form-group">
                    <label class="form-label" for="loginUser">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="loginUser" name="username" class="form-control" placeholder="Enter username or email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="loginPass">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPass" name="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPass', this)" aria-label="Toggle password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Options: Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-copy">© 2026 ProphetAI Real Estate Valuation. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
